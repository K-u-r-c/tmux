set -g mouse on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'
set -sg escape-time 10
set-option -g focus-events on

set -g history-limit 100000

unbind C-b
set -g prefix None
bind C-Space send-keys C-Space

# pasek widoczny tylko w trybie prefixu: zamiast włączać status (co zmienia
# rozmiar paneli i powoduje miganie) rysujemy go jako komunikat nałożony na
# ostatnią linijkę.
#
# Animacja: najpierw szybki fade-in (klatki @bar-f1..3), potem pętla @bar-loop,
# która co 50 ms przerysowuje pasek z mrugającym kursorem ▍, dopóki tmux czeka
# na klawisz. Pętla działa w całości wewnątrz tmuxa i przed każdą klatką
# sprawdza tablicę klawiszy, więc kończy się dokładnie w chwili wciśnięcia
# klawisza. Każda klatka ma -d 250, więc gdyby pętla stanęła, pasek i tak
# zniknie sam po 250 ms (np. po końcu powtarzania H/J/K/L).
# Kolory kursora i klatki wejścia generuje ~/.config/tmux/bar-frames.sh.
set -g status off
set -g @bar-loop 'if -F "#{==:#{client_key_table},prefix}" { set -gF @bar-tick "#{e|+:#{@bar-tick},1}" ; display-message -d 250 "#{E:@bar}" ; run -b -d 0.05 -C "#{@bar-loop}" }'
bind -n C-Space {
  switch-client -T prefix
  set -g @bar-tick 0
  display-message -d 250 "#{E:@bar-f1}"
  run -d 0.03
  display-message -d 250 "#{E:@bar-f2}"
  run -d 0.03
  display-message -d 250 "#{E:@bar-f3}"
  run -d 0.03
  run -C "#{@bar-loop}"
}

setw -g mode-keys vi

bind | split-window -h
bind - split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── theme: monochrome ────────────────────────────────────────────
# pasek składa się z dwóch części, sklejanych w @bar:
#   lewo:   okna (aktywne na ciemnoszarym tle); · liczba paneli, + zoom, • aktywność, ! dzwonek
#   prawo:  tryb kopiowania, katalog aktywnego panelu, host, data i godzina
setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off

set -g @bar-win-flags '#{?#{>:#{window_panes},1},#[fg=#444444] ·#{window_panes},}#{?window_zoomed_flag,#[fg=#888888] +,}#{?window_bell_flag,#[fg=#ffffff bold] !#[nobold],#{?window_activity_flag,#[fg=#aaaaaa] •,}}'
set -g @bar-windows '#{W:#[fg=#444444] #I #[fg=#777777]#W#{E:@bar-win-flags} #[default] ,#[bg=#262626 fg=#666666] #I #[fg=#ffffff bold]#W#[nobold]#{E:@bar-win-flags} #[default] }'
set -g @bar-right '#{?pane_in_mode,#[fg=#000000 bg=#888888] COPY #[default]  ,}#[fg=#555555]#{=/-40/…;s|^/home/[^/]+|~|:pane_current_path}#[fg=#2a2a2a]  │  #[fg=#444444]#{host_short}#[fg=#2a2a2a]  │  #[fg=#555555]%a %d.%m  #[fg=#ffffff bold]%H:%M#[nobold] '
set -g @bar '#[fg=#{E:@bar-cursor}]▍#{E:@bar-windows}#[align=right]#{E:@bar-right}'
run '~/.config/tmux/bar-frames.sh'

set -g pane-border-lines single
set -g pane-border-style "fg=#222222"
set -g pane-active-border-style "fg=#555555"

set -g message-style "bg=default,fg=#ffffff"
set -g message-command-style "bg=default,fg=#888888"
set -g mode-style "bg=#333333,fg=#ffffff"
set -g clock-mode-colour "#ffffff"

set -g window-style "bg=default"
set -g window-active-style "bg=default"

bind-key -T copy-mode-vi y send -X copy-selection
